# Required checks: pr-title, version (this workflow) and ci-gate (ci.yml).
# Replace FREYR_SHA with the commit of freyr/.github (Dependabot keeps it current).
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/pr-title@FREYR_SHA # v1.0.0

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/version@FREYR_SHA # v1.0.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
