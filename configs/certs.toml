# Wildcard certificate made by mkcert (make certs).
# The file names are fixed; the domain lives inside the certificate.
[[tls.certificates]]
certFile = "/certs/local.crt"
keyFile = "/certs/local.key"
stores = ["default"]

[tls.stores]
[tls.stores.default]
[tls.stores.default.defaultCertificate]
certFile = "/certs/local.crt"
keyFile = "/certs/local.key"
